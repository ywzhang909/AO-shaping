# =============================================================================
# phoebus/settings/settings.ini - Phoebus 偏好设置
#
# 挂载位置:/settings/settings.ini (容器内),由 phoebus.sh 检测并挂载。
# 完整偏好项见 Phoebus 文档:
#   https://control-system-studio.readthedocs.io/en/latest/preference_properties.html
# =============================================================================

# ---- CA 地址(经 CA Gateway 访问 IOC)----
# 客户端连接 WSL_IP:5062 处的 CA Gateway,由网关代理到 Windows Host 上的 IOC
# 关闭自动广播,显式指向网关
org.phoebus.pv.ca/auto_addr_list=false
# 网关端口:WSL_IP 5062(与 services/.env GATEWAY_PORT 一致)
org.phoebus.pv.ca/name_servers=172.26.56.202:5062
# 网关支持 PVA 时取消注释(默认走 CA)
# org.phoebus.pv.pva/epics_pva_auto_addr_list=false
# org.phoebus.pv.pva/epics_pva_name_servers=172.26.56.202

# ---- 大数组(SLM 相位图 1920x1200x2B)----
org.phoebus.pv.ca/max_array_bytes=10000000

# ---- OPI 资源路径 ----
# 自动生成的 OPI(由 ioc.yaml 生成)与手工 OPI 均挂载到 /tmp/opi
org.csstudio.display.builder/model_paths=/tmp/opi/auto-generated:/tmp/opi/custom

# ---- 应用外观 ----
org.phoebus.ui/name=Optics EPICS Control
org.phoebus.ui/version=1.0.0
org.phoebus.ui/help_uri=https://epics-containers.github.io/main/tutorials/intro.html
