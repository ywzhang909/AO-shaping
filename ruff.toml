# Ruff Configuration
# Linter and formatter for Python

[lint]
# Enable only the most critical rules
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
]

# Deliberately no `exclude`. It used to hold `exclude = ["src/ml/**"]`, justified as
# "legacy code with syntax errors" -- false: the 30 F821 names it hid were runtime
# NameErrors in `ao-train` entry points. Guarded by
# tests/ao_shaping/ml/test_train_cli_runnable.py::test_ruff_excludes_nothing_under_src.

# Ignore rules that are too noisy for this legacy codebase
ignore = [
    # Unicode - too noisy
    "RUF001", "RUF002", "RUF003",
    
    # Isort
    "I001", "I002",
    
    # Pyupgrade
    "UP007",
    
    # Line length
    "E501",
    
    # Unused - too noisy
    "F401", "F841", "F811",
    
    # Import patterns
    "PLC0415", "E402",
    
    # Syntax issues in legacy code
    "E731", "E741",
]

[lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR2004", "T20"]
"scripts/*" = ["E501", "PLC0415"]
"demo*/*" = ["E501", "PLC0415"]
# Lazy loading in __init__.py is intentional to avoid circular imports
"__init__.py" = ["PLC0415", "PLR0911", "PLR0912"]


[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"