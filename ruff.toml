# Ruff Configuration
# Linter and formatter for Python

[lint]
# Enable only the most critical rules
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    # RUF100 (issue #169): a `# noqa` naming a rule that is not enabled, or whose
    # violation is already gone, suppresses nothing today -- but it still reads to a
    # reviewer as a live exemption, and it silently masks the next real violation of
    # that rule. 864 such directives were removed in one pass, every touched file
    # verified AST-identical. Enforced here so the debt cannot regrow.
    #
    # Anyone widening `select` later: RUF100's notion of "unused" is computed against
    # the *enabled* rule set, so measure it with the project config plus RUF100
    # (`ruff check --extend-select RUF100`), never `--select RUF100` on its own. An
    # isolated select makes genuinely live directives (F401 under `F`) look dead, and
    # `--fix` then deletes them together with the trailing rationale prose. Write the
    # reason as its own comment so a future sweep cannot eat it.
    "RUF100",
    # B023 (flake8-bugbear): a function defined inside a loop body that closes
    # over a loop variable keeps only the *last* iteration's value if it is
    # invoked after the loop. All 44 findings were real late-binding hazards
    # whose fix is to bind the value as a default argument
    # (`def f(x=loop_var)` / `lambda x=loop_var:`), which is what #170 cleared.
    # Enabled so the hazard cannot regrow; see issue #170.
    "B023",
    # PLR0124 (pylint): `x == x` / `x != x` is only ever a NaN test
    # (`x != x` is the canonical nan-check idiom). All 45 sites were rewritten
    # to `math.isnan(x)` / `not math.isnan(x)`, which is explicit and identical
    # for real scalars; see issue #171.
    "PLR0124",
]

# Deliberately no `exclude` for project code. It used to hold `exclude = ["src/ml/**"]`,
# justified as "legacy code with syntax errors" -- false: the 30 F821 names it hid were
# runtime NameErrors in `ao-train` entry points. Guarded by
# tests/ao_shaping/ml/test_train_cli_runnable.py::test_ruff_excludes_nothing_under_src.
# The only excluded paths are third-party vendored libs (OOPAO, SLM_DLL_ver.2.51,
# micro_drive1300, santec_slm, MiiCam SDK -- not project code, see issue #132) and scratch
# notebooks/ debug scripts. The vendored SDK patterns use `**/<name>/**` (never a `src/`
# prefix) so the guard stays satisfied.
exclude = [
    "libs/**",
    "notebooks/**",
    # Vendored MiiCam SDK ctypes binding (drivers/ccd/_miicam_sdk/miicam.py).
    # Third-party generated wrapper: 8 F821 undefined names (cls.__hotplug_cb,
    # AwbOnce, AbbOnce, FfcOnce, DfcOnce, __progress_cb, __progress_ctx) plus
    # E401/E703 -- all real in the upstream code, not project code. Excluded
    # from `ruff check .` the same way libs/** and notebooks/** are.
    # Guarded by tests/ao_shaping/ml/test_train_cli_runnable.py -- the pattern
    # must not start with "src" or contain "src/".
    "**/_miicam_sdk/**",
]

# Ignore rules that are too noisy for this legacy codebase
ignore = [
    # Unicode - too noisy
    "RUF001", "RUF002", "RUF003",
    
    # Isort
    "I001", "I002",
    
    # Pyupgrade
    "UP007",
    
    # Line length
    "E501",
    
    # Unused - too noisy
    "F841", "F811",
    
    # Import patterns
    "PLC0415", "E402",
    
    # Syntax issues in legacy code
    "E731", "E741",
]

[lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR2004", "T20", "F401"]
"scripts/*" = ["E501", "PLC0415", "F401"]
"demo*/*" = ["E501", "PLC0415"]
# Lazy loading in __init__.py is intentional to avoid circular imports
"__init__.py" = ["PLC0415", "PLR0911", "PLR0912", "F401"]

# F401 moved out of the global `ignore` into per-file-ignores (R-63 step 2).
# TODO.md 8.2 predicted the noise would be "mostly __init__.py re-exports"; measured,
# it was the inverse -- 157 in ordinary modules vs 5 in __init__.py -- so that
# estimate was wrong and the order was backwards. src/ is now clean and enforced.
# gui/slm/__init__.py imports pyarrow_probe purely for its import side effect, which is
# a third reason __init__.py cannot be swept by F401.
# tests/ (110) and scripts/ (68) are real findings left for a later slice, TODO.md R-63.


[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"