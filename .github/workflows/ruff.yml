name: Ruff

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      # Exact pin, identical to ci.yml -- two workflows both run `ruff check .`
      # as a hard gate, so they must run the same ruff. `>=` here used to make CI
      # non-reproducible: a new ruff release could flip the gate with no code
      # change. See tests/ao_shaping/test_conventions.py::
      # test_all_ruff_pins_agree_and_are_exact
      run: pip install "ruff==0.15.12"
    - name: Ruff (hard gate)
      run: ruff check .
