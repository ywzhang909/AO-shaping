name: CI

# Restored 2026-10-21 after the quality gate was removed from version control
# (see CHANGELOG v0.19.0 note). The original gate was a ruff hard check on
# push + PR; this workflow restores that and adds a best-effort test run.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ruff:
    name: Ruff lint gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install ruff (exact pin, shared with ruff.yml and the dev-group floor)
        # One version gates the repo. Pinned exactly, not `>=`: a floating bound
        # lets a new ruff release flip this hard gate red with no code change in
        # between. Kept equal to ruff.yml and to pyproject's `ruff>=` floor so CI
        # runs the ruff developers actually install.
        # Pinned by tests/ao_shaping/test_conventions.py::
        # test_all_ruff_pins_agree_and_are_exact
        run: uv tool install ruff==0.15.12
      - name: Run ruff (enforced gate from ruff.toml)
        run: ruff check .

  terminology:
    name: Terminology gate
    # AGENTS.md makes the glossary gate a required pre-commit check, but nothing
    # enforced it: the unifier scanned only markdown, exited 0 whatever it found,
    # and no workflow or test invoked it -- so the rule survived on memory (#194).
    # --check turns the same scan into an exit code. Stdlib-only, so no uv and no
    # container; it costs under a second and is a hard gate, like ruff above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Glossary gate (exit 1 on non-canonical terms)
        run: python3 scripts/_common/term_unify_20261016.py --check

  # Tests moved to .github/workflows/pytest.yml (2026-10-24): a hard gate that runs
  # the suite in measured shards, one pytest process each.
  #
  # The whole-suite invocation that used to live here cannot pass on a runner. The
  # suite does not fit one pytest process: `run_pytest_ci.sh` with no target is
  # SIGKILLed (exit 137) at 34% under a 16g ceiling, and ubuntu-latest has 16 GB
  # total with the runner itself holding some of it. `optimizer` alone dies at both
  # 6g and 12g while each of its 68 files passes alone under 4g, so the limit is
  # in-process accumulation, not one large case -- hence shards, and per-file
  # isolation where sharding still is not enough.
