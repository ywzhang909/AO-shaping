[project]
name = "ao_shaping"
version = "0.1.0"
description = "AO-Shaping自适应光学系统命令行工具，支持波前校正和光束整形。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.0",
    "coredumpy>=0.4.3",
    "findlibs>=0.1.2",
    "loguru>=0.7.3",
    "matplotlib>=3.9.2",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "pygame>=2.6.1",
    "scipy>=1.15.0",
    "tqdm>=4.67.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
