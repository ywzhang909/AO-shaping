[project]
name = "ao_shaping"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "dask>=2025.9.0",
    "pygame>=2.6.1",
    "tqdm>=4.67.1",
    "matplotlib>=3.9.2",
    "pyserial>=3.5",
    "nidaqmx>=0.8.10",
    "scikit-optimize>=0.10.2",
    "streamlit>=1.49.1",
    "plotly>=6.3.0",
    "torchkeras>=4.0.5",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "timm>=1.0.20",
    "accelerate>=1.10.1",
    "pyarrow>=21.0.0",
    "tabm>=0.0.3",
    "ipywidgets>=8.1.7",
    "gymnasium>=1.2.1",
    "stable-baselines3[extra]>=2.7.0",
    "sb3-contrib>=2.7.0",
    "segmentation-models-pytorch>=0.5.0",
    "hf-xet>=1.1.10",
    "torchview>=0.2.7",
    "tensorboard>=2.20.0",
    "nuitka>=2.8.1",
    "ipykernel>=7.0.1",
    "nbformat>=4.2.0",
    "grad-cam>=1.5.5",
    "mbrl>=0.0.1",
    "ordered-set>=4.1.0",
    "findlibs>=0.1.2",
    "pytest>=8.4.2",
    "loguru>=0.7.3",
    "ansi2html>=1.9.2",
    "typing-extensions>=4.12.2",
    "pyside6>=6.7.3",
    "pyside6-fluent-widgets>=1.6.5",
    "numba>=0.62.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
