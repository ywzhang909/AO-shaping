[project]
name = "ao_shaping"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "pygame>=2.6.1",
    "tqdm>=4.67.1",
    "matplotlib>=3.9.2",
    "pyserial>=3.5",
    "nidaqmx>=0.8.10",
    "scikit-optimize>=0.10.2",
    "tensorboard>=2.20.0",
    "nuitka>=2.8.1",
    "ordered-set>=4.1.0",
    "findlibs>=0.1.2",
    "pytest>=8.4.2",
    "loguru>=0.7.3",
    "ansi2html>=1.9.2",
    "typing-extensions>=4.12.2",
    "numba>=0.62.1",
    "pytest-cov>=7.0.0",
    "coredumpy>=0.4.3",
    "asyncer>=0.0.10",
    "click>=8.3.0",
    "setuptools>=80.9.0",
    "gymnasium>=1.2.2",
    "timm>=1.0.22",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
